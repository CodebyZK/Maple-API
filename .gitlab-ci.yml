image: python:3.12-slim

stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key:
    files:
      - pyproject.toml
  paths:
    - .cache/pip/

api-contract-tests:
  stage: test
  before_script:
    - python -m pip install --disable-pip-version-check -e ".[dev]"
  script:
    - python -m pytest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
